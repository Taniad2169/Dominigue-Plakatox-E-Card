<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominique Verna - E-Card</title>
    <!-- Links to your manifest for the Home Screen app feel -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dominique Verna">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #defcf4; /* Mint background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 3D Flip Container */
        .card-container {
            background-color: transparent;
            width: 100%;
            max-width: 400px;
            height: 600px;
            perspective: 1000px; /* Gives the 3D effect */
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        /* Toggles the flip */
        .is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(13, 122, 93, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0d7a5d; /* Deep Teal */
            font-size: 28px;
            margin-bottom: 5px;
        }

        /* Visible email removed from here as requested! */

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #0d7a5d;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 10px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-full {
            grid-column: span 2;
            background-color: #333333; /* Distinct color for saving contacts */
        }

        .action-row {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        .action-row .btn {
            flex: 1;
            background-color: #defcf4;
            color: #0d7a5d;
            border: 2px solid #0d7a5d;
        }

        .qr-image {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            border: 10px solid #defcf4;
            border-radius: 15px;
        }

        #copy-notification {
            color: #0d7a5d;
            font-weight: bold;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card-inner" id="card">
            
            <!-- FRONT OF CARD -->
            <div class="card-front">
                <div class="header">
                    <h1>Dominique Verna</h1>
                </div>

                <div class="btn-grid">
                    <a href="tel:5164242140" class="btn">📞 Call</a>
                    <a href="sms:5164242140" class="btn">💬 Text</a>
                    <a href="mailto:dom1109@aol.com" class="btn">✉️ Email</a>
                    <a href="https://wa.me/15164242140" target="_blank" class="btn">📱 WhatsApp</a>
                    
                    <!-- Save to Contacts Button -->
                    <button onclick="downloadVCard()" class="btn btn-full">📥 Save to Contacts</button>
                </div>

                <div class="action-row">
                    <!-- Flip to back -->
                    <button onclick="flipCard()" class="btn">🔄 QR Code</button>
                    <!-- Share via copying link -->
                    <button onclick="copyLink()" class="btn">🔗 Share</button>
                </div>
                
                <p id="copy-notification">Link copied!</p>
            </div>

            <!-- BACK OF CARD -->
            <div class="card-back">
                <h2 style="color: #0d7a5d; margin-bottom: 20px;">Scan to Call</h2>
                
                <!-- QR Code dynamically generated containing the phone number -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=tel:5164242140&color=0d7a5d&bgcolor=defcf4" alt="QR Code" class="qr-image">
                
                <!-- Flip to front -->
                <button onclick="flipCard()" class="btn" style="width: 80%;">Back to Card</button>
            </div>

        </div>
    </div>

    <script>
        // Flip animation trigger
        function flipCard() {
            const card = document.getElementById('card');
            card.classList.toggle('is-flipped');
        }

        // Copy link to share
        function copyLink() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                const notice = document.getElementById('copy-notification');
                notice.style.opacity = '1';
                setTimeout(() => {
                    notice.style.opacity = '0';
                }, 2000);
            });
        }

        // Generate and download the vCard (.vcf)
        // This is where the email is hidden but perfectly formatted for the phone!
        function downloadVCard() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:Verna;Dominique;;;
FN:Dominique Verna
TEL;TYPE=CELL:516-424-2140
EMAIL;TYPE=PREF,INTERNET:dom1109@aol.com
END:VCARD`;

            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'Dominique_Verna.vcf';
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
