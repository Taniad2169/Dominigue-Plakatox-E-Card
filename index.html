<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominique Verna - Digital E-Card</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load QRCode.js for dynamic QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Configure custom colors in Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d7a5d',       /* Updated deeper green color */
                        primaryHover: '#0a614a',  /* Slightly darker for hover states */
                        cardBg: '#defcf4',        /* Mint background */
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #defcf4;
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3D Flip Card CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Safari support */
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        .flip-transition {
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .qr-container img {
            margin: 0 auto;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- 3D Flip Card Container -->
    <div class="bg-transparent w-full max-w-sm h-[650px] perspective-1000 fade-in-up">
        
        <!-- Inner container that actually flips -->
        <div id="flip-card-inner" class="relative w-full h-full transform-style-3d flip-transition shadow-xl rounded-3xl">
            
            <!-- ================= FRONT FACE ================= -->
            <div class="absolute inset-0 w-full h-full backface-hidden bg-white rounded-3xl overflow-hidden flex flex-col">
                
                <!-- Header Banner -->
                <div class="bg-primary h-24 w-full shrink-0 relative"></div>

                <!-- Profile Avatar (Initials) -->
                <div class="relative flex justify-center -mt-12 shrink-0">
                    <div class="w-24 h-24 bg-white rounded-full p-1 shadow-md">
                        <div class="w-full h-full bg-cardBg text-primary rounded-full flex items-center justify-center text-3xl font-bold border-2 border-primary">
                            DV
                        </div>
                    </div>
                </div>

                <!-- Profile Info -->
                <div class="text-center px-6 pt-4 pb-2">
                    <h1 class="text-2xl font-bold text-gray-800">Dominique Verna</h1>
                    <p class="text-sm font-medium text-primary mt-1">Digital Business Card</p>
                    
                    <div class="mt-3 space-y-1 text-gray-600 text-sm">
                        <p class="flex items-center justify-center gap-2">
                            <i class="fa-solid fa-phone text-primary w-4"></i>
                            (516) 434-3140
                        </p>
                        <p class="flex items-center justify-center gap-2">
                            <i class="fa-solid fa-envelope text-primary w-4"></i>
                            dom1109@aol.com
                        </p>
                    </div>

                    <!-- Action Buttons Grid -->
                    <div class="grid grid-cols-2 gap-3 mt-5">
                        <!-- Call Button -->
                        <a href="tel:5164343140" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-sm">
                            <i class="fa-solid fa-phone text-xl mb-1"></i>
                            <span class="text-xs font-semibold">Call</span>
                        </a>

                        <!-- Text Message Button -->
                        <a href="sms:5164343140" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-sm">
                            <i class="fa-solid fa-comment-sms text-xl mb-1"></i>
                            <span class="text-xs font-semibold">Message</span>
                        </a>

                        <!-- Email Button -->
                        <a href="mailto:dom1109@aol.com" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-sm">
                            <i class="fa-solid fa-envelope text-xl mb-1"></i>
                            <span class="text-xs font-semibold">Email</span>
                        </a>

                        <!-- WhatsApp Button -->
                        <a href="https://wa.me/15164343140" target="_blank" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-sm">
                            <i class="fa-brands fa-whatsapp text-xl mb-1"></i>
                            <span class="text-xs font-semibold">WhatsApp</span>
                        </a>
                    </div>

                    <!-- Save Contact Button -->
                    <div class="mt-4">
                        <button onclick="downloadVCard()" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-gray-800 text-white font-bold text-sm rounded-xl hover:bg-gray-900 transition-all shadow-md transform hover:scale-[1.02]">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Save to Contacts</span>
                        </button>
                    </div>

                    <!-- Lower Utility Buttons (Share & QR Code) -->
                    <div class="flex gap-3 mt-4 border-t border-gray-100 pt-4">
                        <button onclick="shareCard()" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-cardBg text-primary font-semibold text-sm rounded-xl hover:bg-primary/20 transition-colors shadow-inner border border-primary/20">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span id="share-text">Share</span>
                        </button>

                        <button onclick="flipCard()" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-cardBg text-primary font-semibold text-sm rounded-xl hover:bg-primary/20 transition-colors shadow-inner border border-primary/20">
                            <i class="fa-solid fa-qrcode"></i>
                            <span>QR Code</span>
                        </button>
                    </div>
                    
                </div>
            </div>

            <!-- ================= BACK FACE ================= -->
            <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-white rounded-3xl overflow-hidden flex flex-col justify-between">
                
                <!-- Back Header -->
                <div class="bg-primary h-16 w-full flex items-center justify-center">
                    <h2 class="text-white font-semibold tracking-wider uppercase text-sm">Scan to Connect</h2>
                </div>

                <!-- QR Code Section -->
                <div class="flex flex-col items-center justify-center flex-1 px-6">
                    <p class="text-gray-800 font-bold text-lg mb-1">Dominique Verna</p>
                    <p class="text-sm text-gray-500 mb-6 text-center">Open your camera and scan the code below to call me directly.</p>
                    
                    <div class="p-4 bg-cardBg rounded-2xl shadow-inner border border-primary/30 transform transition-transform hover:scale-105">
                        <!-- The QR code will be injected here by JavaScript -->
                        <div id="qrcode" class="qr-container bg-white p-2 rounded-xl"></div>
                    </div>
                </div>

                <!-- Back to Front Button -->
                <div class="p-6">
                    <button onclick="flipCard()" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-primary text-white font-semibold text-sm rounded-xl hover:bg-primaryHover transition-all shadow-md">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>Back to Card</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Generate and download a vCard file to automatically open the phone's Contact saving screen
        function downloadVCard() {
            // Standard vCard format containing the specific contact fields
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Dominique Verna
N:Verna;Dominique;;;
TEL;TYPE=CELL:5164343140
EMAIL;TYPE=PREF,INTERNET:dom1109@aol.com
END:VCARD`;
            
            // Create a downloadable file in the browser on the fly
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            // Temporarily create a link, click it to trigger download, and remove it
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Dominique_Verna.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Toggle the flip class to rotate the card 180 degrees
        function flipCard() {
            const cardInner = document.getElementById('flip-card-inner');
            cardInner.classList.toggle('rotate-y-180');
        }

        // Copy the current page URL to clipboard using execCommand
        function shareCard() {
            // Get the URL (or a dummy link if viewed locally)
            const urlToShare = window.location.href; 
            
            // Create a temporary hidden input to copy text
            const tempInput = document.createElement("input");
            tempInput.value = urlToShare;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            // Give visual feedback on the button
            const shareText = document.getElementById('share-text');
            const originalText = shareText.innerText;
            shareText.innerText = 'Copied!';
            
            // Reset text after 2 seconds
            setTimeout(() => {
                shareText.innerText = originalText;
            }, 2000);
        }

        // Initialize the QR Code on page load
        window.onload = function() {
            // Data to encode in the QR code (Phone Number)
            const qrData = "tel:5164343140";
            
            // Get the container element
            const qrContainer = document.getElementById("qrcode");
            
            // Generate the QR code using the new primary color #0d7a5d
            new QRCode(qrContainer, {
                text: qrData,
                width: 160, // Slightly larger on the back
                height: 160, 
                colorDark : "#0d7a5d", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H 
            });
        };
    </script>
</body>
</html>
